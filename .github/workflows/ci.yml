name: CI

on:
  push:
    branches:
      - main
  pull_request:

# Cancel superseded runs on the same branch/PR to avoid wasting CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-build-test:
    name: Lint, typecheck, build, and test
    runs-on: ubuntu-latest

    # MySQL service container so the database-mysql plugin's
    # *.integration.test.ts suites (see tests/plugins/database-mysql/) run
    # for real in CI instead of self-skipping — same image/credentials/
    # healthcheck as docker-compose.yml's local `mysql` service, so a
    # passing suite here means the same thing as a passing suite locally
    # under `docker compose up -d mysql` (feature #27, steps 2-3).
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: appskeleton
          MYSQL_USER: appskeleton
          MYSQL_PASSWORD: change-me
          MYSQL_ROOT_PASSWORD: change-me-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -pchange-me-root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      # fetch-depth: 0 pulls full git history (not just the tip commit) so the
      # secrets scan step below can walk every commit, not merely the current
      # snapshot — a secret committed and later deleted would otherwise go
      # undetected.
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Fails the build on any high/critical-severity known vulnerability in the
      # dependency tree (feature #104). See docs/security.md for the remediation
      # process a flagged finding should follow. `npm ci` above already pins
      # exact versions from package-lock.json, so this audits precisely what
      # actually gets installed, not a resolvable-but-unused range.
      - name: Dependency vulnerability scan
        run: npm audit --audit-level=high

      # Scans the full git history (every commit, not just the current diff) for
      # accidentally committed secrets — API keys, tokens, private keys, etc. —
      # using gitleaks (feature #106). Installed as a pinned static binary
      # (rather than a Marketplace Action) so the check has no dependency on a
      # third-party action's licensing terms and its version is explicit and
      # reproducible. A secret committed in any commit and later removed still
      # fails this step, same as one still present in the working tree. See
      # docs/security.md for the remediation process a flagged finding should
      # follow.
      - name: Secrets scan (gitleaks)
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks detect --source . --redact --no-banner -v

      - name: Lint
        run: npm run lint

      - name: Build (includes TypeScript type checking)
        run: npm run build

      - name: Run database-mysql migrations
        run: npm run migrate
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_USER: appskeleton
          DB_PASSWORD: change-me
          DB_NAME: appskeleton

      # Includes tests/plugins/html-renderer/xss-regression.test.ts (feature #54), the
      # table-driven XSS regression suite that cross-multiplies known payloads against every
      # non-raw escaping context (HTML/attribute/URL/JS) plus the audited {{{raw ...}}} helper —
      # a failure here fails this required job exactly like any other test failure would.
      - name: Unit + integration tests
        run: npm test
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_USER: appskeleton
          DB_PASSWORD: change-me
          DB_NAME: appskeleton
